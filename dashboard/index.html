<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Projects — Private</title>
<!-- Hand-written hub. Tiles come from projects.json; see docs/dashboard.md. -->
<style>
:root{--bg:#fff;--fg:#24292e;--muted:#6a737d;--card:rgba(127,127,127,.06);--border:rgba(127,127,127,.22);--ok:#2f9028;--stale:#d29922;--none:#8b949e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--ok:#3fb950;--stale:#e3b341}}
*{box-sizing:border-box}
body{margin:0;padding:2rem 1rem;background:var(--bg);color:var(--fg);line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto}
h1{margin:0 0 .25rem}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:1rem}
.tile{display:flex;flex-direction:column;gap:.5rem;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:12px;background:var(--card);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--muted);transform:translateY(-1px)}
.head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.name{font-weight:600;font-size:1.05rem}
.status{font-size:.75rem;color:var(--muted);white-space:nowrap}
.status::before{content:"●";margin-right:.3rem;color:var(--none)}
.status[data-health="ok"]::before{color:var(--ok)}
.status[data-health="stale"]::before{color:var(--stale)}
.desc{color:var(--muted);font-size:.88rem;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.25rem 0 0;padding:0;list-style:none}
.stats li{font-size:.85rem}
.stats b{display:block;font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.foot{margin-top:auto;font-size:.75rem;color:var(--muted)}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Projects</h1>
  <p class="sub">Things I'm maintaining. Private — aggregates only.</p>
  <div id="grid" class="grid"><p class="empty">Loading…</p></div>
</main>
<script>
(function(){
  var DAY=864e5;
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function fmtDate(iso){return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})}
  function health(p,s){
    if(!s||!s.as_of)return["none","No data"];
    var age=Math.floor((Date.now()-new Date(s.as_of+"T00:00:00"))/DAY);
    var limit=p.stale_after_days;
    if(limit!=null&&age>limit)return["stale",age+"d old"];
    return["ok","OK"];
  }
  function tile(p,s){
    var external=/^https?:\/\//.test(p.href);
    var a=el("a","tile");a.href=p.href;
    if(external){a.target="_blank";a.rel="noopener"}
    var head=el("div","head");
    head.appendChild(el("span","name",(p.icon?p.icon+" ":"")+p.name+(external?" ↗":"")));
    if(p.summary){
      var h=health(p,s),st=el("span","status",h[1]);st.dataset.health=h[0];head.appendChild(st);
    }
    a.appendChild(head);
    if(p.description)a.appendChild(el("p","desc",p.description));
    if(s&&s.stats&&s.stats.length){
      var ul=el("ul","stats");
      s.stats.forEach(function(x){var li=el("li");li.appendChild(el("b",null,x.label));li.appendChild(document.createTextNode(x.value));ul.appendChild(li)});
      a.appendChild(ul);
    }
    if(s&&s.as_of)a.appendChild(el("div","foot","Updated "+fmtDate(s.as_of)));
    return a;
  }
  function getJSON(url){return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
  var grid=document.getElementById("grid");
  getJSON("projects.json").then(function(projects){
    return Promise.all(projects.map(function(p){
      return p.summary?getJSON(p.summary).catch(function(){return null}):Promise.resolve(null);
    })).then(function(summaries){
      grid.innerHTML="";
      if(!projects.length){grid.appendChild(el("p","empty","No projects yet."));return}
      projects.forEach(function(p,i){grid.appendChild(tile(p,summaries[i]))});
    });
  }).catch(function(e){grid.innerHTML="";grid.appendChild(el("p","empty","Couldn't load projects.json ("+e.message+")."))});
})();
</script>
</body>
</html>
